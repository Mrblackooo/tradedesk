name: scalp
on:
  push:
    branches: [main]
    paths: ['scalp.js', 'engine.js']
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desk
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Scansione scalping
        run: node scalp.js
      - name: Salva risultati
        run: |
          git config user.name desk-bot
          git config user.email desk-bot@users.noreply.github.com
          git add data/scalp.json
          git diff --cached --quiet || (git commit -m "scalp scan" && git pull --rebase && git push)
