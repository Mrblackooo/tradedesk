name: retest
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desk
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node auto.js
      - run: |
          git config user.name desk-bot
          git config user.email desk-bot@users.noreply.github.com
          git add config.json
          git diff --cached --quiet || (git commit -m "retest strategie" && git pull --rebase && git push)
