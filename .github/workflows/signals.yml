name: signals
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desk
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            .model-cache
          key: model-${{ hashFiles('package.json') }}
      - run: npm install --no-audit --no-fund
      - run: node auto.js --if-empty
      - run: node run.js
      - run: |
          git config user.name desk-bot
          git config user.email desk-bot@users.noreply.github.com
          git add data config.json
          git diff --cached --quiet || (git commit -m "update signals" && git pull --rebase && git push)
